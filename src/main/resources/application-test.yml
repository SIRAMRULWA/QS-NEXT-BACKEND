spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    za.co.qsnext.employeemanagement: INFO
    org.springframework.security: WARN
    org.testcontainers: INFO
    com.github.dockerjava: WARN

# Test-only signing secret. Never used outside the "test" profile and never
# valid for a real deployment. Datasource/RabbitMQ/Redis connection details
# are supplied dynamically by Testcontainers via @ServiceConnection and are
# intentionally not set here.
security:
  jwt:
    secret: test-only-jwt-signing-secret-do-not-use-in-production-0123456789
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

  # The production default (10 requests/60s) is meant to gate a single real
  # client. Every *IntegrationTest shares one Spring context, one Redis
  # instance and one MockMvc-resolved remote address, so dozens of test
  # classes registering users in the same run would otherwise all trip the
  # same per-IP counter well before any one class's own assertions run.
  rate-limit:
    max-requests: 100000
    window-seconds: 60

# Fast retry/backoff so tests that exercise the retry -> DLQ path don't
# have to wait out production-sized delays.
email:
  from-address: no-reply@qsnext.co.za

  consumer:
    max-attempts: 3
    initial-interval-ms: 20
    backoff-multiplier: 2.0
    max-interval-ms: 100
    # A single consumer thread (the implicit default everywhere else) is
    # plenty for one real deployment's traffic, but this suite's ~40
    # *IntegrationTest classes share one Spring context, one queue and
    # that one thread - so every class's WELCOME/PASSWORD_RESET/
    # notification email queues up behind whatever the rest of the suite
    # is still sending. EmailConsumer is now safe to run concurrently
    # (it tolerates a losing race on the same message via
    # ObjectOptimisticLockingFailureException), so a handful of
    # consumers here just gives the suite enough real throughput that a
    # healthy email reaches SENT within a test's own wait window instead
    # of merely waiting its turn.
    concurrency: 5
    max-concurrency: 5

  outbox:
    sweep-interval-ms: 1000
    # A 1-second threshold sounded appealingly fast, but it actively broke
    # things: the sweep would republish an email that was still legitimately
    # mid-flight through its normal after-commit publish (not lost at all),
    # so the same row got consumed twice - and Email's @Version column then
    # threw ObjectOptimisticLockingFailureException on the second save,
    # which is not an EmailDeliveryException so EmailConsumer never catches
    # it, sending an otherwise-healthy email to the DLQ. 30s is still far
    # below production's 120s default and imperceptible next to this
    # suite's Testcontainers startup time, but gives the real pipeline
    # enough room that the sweep only ever fires for genuinely stuck mail.
    stuck-threshold-seconds: 30
    sweep-batch-size: 50
