spring:
  application:
    name: qsnext-employee-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
      health:
        show-details: always
        probes:
          enabled: true

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    za.co.qsnext.employeemanagement: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  auth:
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lock-duration-minutes: ${AUTH_ACCOUNT_LOCK_DURATION_MINUTES:15}
    password-reset-token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}

  cache:
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES:10}
    user-principal-ttl-minutes: ${CACHE_USER_PRINCIPAL_TTL_MINUTES:5}

  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}