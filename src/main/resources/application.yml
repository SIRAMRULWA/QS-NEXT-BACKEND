spring:
  application:
    name: qsnext-employee-management-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      # Upstash (and most managed Redis) require TLS on their public
      # endpoint. Off by default so local/dev Redis - which speaks plain
      # TCP - keeps working without extra setup.
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:5000}
      timeout: ${REDIS_COMMAND_TIMEOUT_MS:3000}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # CloudAMQP (and most managed RabbitMQ) assign a per-instance virtual
    # host rather than the "/" every local broker uses, and require AMQPS
    # (TLS) on their public endpoint. "/" and disabled TLS match a plain
    # local RabbitMQ, so local/dev keeps working without extra setup.
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT_MS:30000}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

  shutdown: graceful

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # The default readiness group only reflects the application's own
      # ReadinessState signal - an orchestrator polling it would see
      # "ready" even with Postgres/Redis/RabbitMQ unreachable. Add those
      # dependency checks explicitly so a broken dependency actually
      # takes the pod out of the load balancer.
      group:
        readiness:
          include: readinessState,db,redis,rabbit

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    za.co.qsnext.employeemanagement: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

  auth:
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    account-lock-duration-minutes: ${AUTH_ACCOUNT_LOCK_DURATION_MINUTES:15}
    password-reset-token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}

  cache:
    default-ttl-minutes: ${CACHE_DEFAULT_TTL_MINUTES:10}
    user-principal-ttl-minutes: ${CACHE_USER_PRINCIPAL_TTL_MINUTES:5}

  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  # Comma-separated IPs/CIDRs of reverse proxies/load balancers this app
  # sits behind, if any. X-Forwarded-For is only trusted for rate-limiting
  # and audit logging when the request's own TCP peer matches one of
  # these - left empty (the safe default), every request is attributed to
  # its direct peer address and X-Forwarded-For is ignored entirely,
  # since trusting it unconditionally lets any external caller spoof a
  # fresh rate-limit bucket per request and forge the "client IP" in the
  # audit trail. Set this to the load balancer/ingress address(es) only
  # if this deployment genuinely sits behind one.
  trusted-proxies: ${SECURITY_TRUSTED_PROXIES:}

  # Comma-separated origins (scheme+host+port) the browser-based frontend
  # is served from - e.g. https://app.qsnext.co.za. Left empty (the safe
  # default), no cross-origin browser request is allowed at all. Only
  # exact origins are matched, never a wildcard, since CORS is combined
  # with allow-credentials for cookie/Authorization-header requests.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

email:
  from-address: ${EMAIL_FROM_ADDRESS:no-reply@qsnext.co.za}

  consumer:
    max-attempts: ${EMAIL_CONSUMER_MAX_ATTEMPTS:3}
    initial-interval-ms: ${EMAIL_CONSUMER_INITIAL_INTERVAL_MS:2000}
    backoff-multiplier: ${EMAIL_CONSUMER_BACKOFF_MULTIPLIER:2.0}
    max-interval-ms: ${EMAIL_CONSUMER_MAX_INTERVAL_MS:30000}

  outbox:
    sweep-interval-ms: ${EMAIL_OUTBOX_SWEEP_INTERVAL_MS:60000}
    stuck-threshold-seconds: ${EMAIL_OUTBOX_STUCK_THRESHOLD_SECONDS:120}
    sweep-batch-size: ${EMAIL_OUTBOX_SWEEP_BATCH_SIZE:50}

document:
  storage:
    local:
      base-path: ${DOCUMENT_STORAGE_LOCAL_BASE_PATH:./data/documents}