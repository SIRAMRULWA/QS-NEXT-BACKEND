name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit, repository and integration tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload packaged jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qsnext-employee-management-system
          path: target/*.jar
          retention-days: 7

  docker-build-and-smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employee_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.12
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qsnext-backend:ci .

      # Runs the actual container the same way Render will: the "prod"
      # profile, against real Postgres/Redis/RabbitMQ (the GitHub-hosted
      # service containers above stand in for Neon/Upstash/CloudAMQP here -
      # same wire protocols, just without TLS), with every connection
      # detail supplied purely through environment variables, exactly as
      # Render injects them. This is the one thing that can't be verified
      # from a dev sandbox with no Docker registry egress: that the built
      # image actually starts, actually connects, and actually shuts down
      # cleanly under `docker run`.
      - name: Start container against real service containers
        run: |
          docker run -d --name qsnext-backend \
            --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://localhost:5432/employee_management \
            -e DB_USERNAME=postgres \
            -e DB_PASSWORD=postgres \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e RABBITMQ_HOST=localhost \
            -e RABBITMQ_PORT=5672 \
            -e RABBITMQ_USERNAME=guest \
            -e RABBITMQ_PASSWORD=guest \
            -e RABBITMQ_VHOST=/ \
            -e CORS_ALLOWED_ORIGINS=https://example.com \
            -e SERVER_PORT=8080 \
            qsnext-backend:ci

      - name: Wait for readiness (proves DB + Redis + RabbitMQ env vars actually connected)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"'; then
              echo "Readiness UP after ${i} attempt(s)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Container never became ready"
          docker logs qsnext-backend
          exit 1

      - name: Verify liveness endpoint (what Render's health check hits)
        run: curl -sf http://localhost:8080/actuator/health/liveness | grep -q '"status":"UP"'

      - name: Graceful shutdown
        run: |
          docker stop --time 30 qsnext-backend
          exit_code=$(docker inspect qsnext-backend --format '{{.State.ExitCode}}')
          docker logs qsnext-backend | tail -40
          echo "Container exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "::error::Container did not shut down cleanly (exit code $exit_code) - SIGTERM may not be reaching the JVM"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker logs qsnext-backend || true
